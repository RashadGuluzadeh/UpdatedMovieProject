<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="description" content="Search movies, build a favorites list and share it with friends." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/cinema.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Josefin+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Movie</title>
    <!-- Splash screen styles live here so they apply before the app's CSS and JS load. -->
    <style>
      html, body { background: #0f1116; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(60% 50% at 50% 45%, #1a1d27 0%, #0f1116 70%);
        transition: opacity 500ms ease, visibility 500ms ease;
      }
      #splash.splash--hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-logo {
        font-family: "Josefin Sans", system-ui, sans-serif;
        font-size: 56px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #e4e6eb;
        animation: splash-in 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-logo span { color: #8b95f7; }
      .splash-bar {
        position: relative;
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #2a2f3a;
        animation: splash-in 700ms 150ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #8b95f7;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-bar { animation: none; }
        .splash-bar::after { animation-duration: 3s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-logo">Movies<span>.</span></div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
